apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'com.winlator'
    compileSdk 35

    defaultConfig {
        // Must stay com.winlator: Winlator's files and paths are tied to this name.
        applicationId 'com.winlator'
        minSdkVersion 26
        targetSdkVersion 28
        versionCode 33
        versionName "11.2"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Two versions of the app. They share one package name, so only one can be installed at a time.
    flavorDimensions 'gpu'
    productFlavors {
        snapdragon {
            dimension 'gpu'
            buildConfigField 'String', 'GPU_FAMILY', '"Snapdragon"'
            manifestPlaceholders = [appLabel: 'Butcher Creek Unofficial Port (Snapdragon)']
        }
        mali {
            dimension 'gpu'
            buildConfigField 'String', 'GPU_FAMILY', '"Mali"'
            manifestPlaceholders = [appLabel: 'Butcher Creek Unofficial Port (Mali)']
        }
    }

    buildTypes {
        debug {
            // Winlator turned this on. It is off here so the shrinker cannot remove code that
            // the native parts call by name.
            minifyEnabled false

            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    ndkVersion '24.0.8215888'

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}

dependencies {
    // Winlator's own libraries
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
    implementation 'androidx.lifecycle:lifecycle-process:2.6.2'

    // Newer fragment so it works with the newer activity that Compose needs
    implementation 'androidx.fragment:fragment:1.6.2'

    // The menu (Kotlin + Compose)
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation-core'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
