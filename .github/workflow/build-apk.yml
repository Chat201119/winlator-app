name: Build APK

# Builds the Butcher Creeks app (Winlator inside) in the cloud. Takes a long time the first
# time (about 20-40 minutes) because it compiles Winlator's native parts for each version.
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Winlator needs these exact Android tools. The runner already has the SDK, so only
      # the two extra parts are added (no setup-android step).
      - name: Install NDK and CMake
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;24.0.8215888" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APKs
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ButcherCreek-APKs
          path: app/build/outputs/apk/*/debug/*.apk
