// Top-level build file. Winlator's original file plus the Kotlin / Compose plugins for the menu.
buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.4.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.0.21'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}
